server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The console is static and same-origin-proxies the API, which means the
    # browser never makes a cross-origin credentialed request in the demo.
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;

        # GET /api/events/stream (api/routers/events.py) is Server-Sent
        # Events: one open response that trickles data for as long as an
        # operator has the console open. HTTP/1.1 plus buffering off is what
        # lets nginx forward each chunk the moment the registry writes it
        # instead of accumulating a buffer first; the registry's own
        # X-Accel-Buffering: no header asks for the same thing on that one
        # response, this just makes sure nothing upstream of it disagrees.
        # The 15s keepalive events.py sends keep this well under the 120s
        # read timeout above for the lifetime of the connection.
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Connection "";
    }

    # Defence-in-depth headers. The CSP is deliberately strict: no inline script,
    # no eval, nothing loaded off-origin. Everything the console needs is vendored.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
