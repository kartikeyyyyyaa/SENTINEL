server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The console is static and same-origin-proxies the API, which means the
    # browser never makes a cross-origin credentialed request in the demo.
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;

        # GET /api/events/stream (api/routers/events.py) is Server-Sent
        # Events: one open response that trickles data for as long as an
        # operator has the console open. HTTP/1.1 plus buffering off is what
        # lets nginx forward each chunk the moment the registry writes it
        # instead of accumulating a buffer first; the registry's own
        # X-Accel-Buffering: no header asks for the same thing on that one
        # response, this just makes sure nothing upstream of it disagrees.
        # The 15s keepalive events.py sends keep this well under the 120s
        # read timeout above for the lifetime of the connection.
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Connection "";
    }

    # ---- Live video (HLS) proxy for the government camera grid ----------------
    # The console plays each camera's HLS stream through THIS origin, never
    # directly against the grid CDN. That does three things at once: it keeps the
    # browser same-origin (no CORS, no CSP hole — connect-src stays 'self'), it
    # keeps the grid access password server-side (the browser never sees it), and
    # it lets any operator watch a feed without logging in to the grid portal.
    #
    # TO ENABLE: uncomment the block below and set the Authorization header to
    # your grid credential. The grid authenticates HLS with your registered
    # email + access password; Basic auth is "email:password" base64-encoded:
    #     printf 'you@example.com:YOURPASSWORD' | base64
    # Then the console's /grid/<id>/index.m3u8 requests are proxied with it.
    # Left commented, the video panel shows a clear "live view not configured"
    # state instead of erroring — the rest of the console is unaffected.
    #
    # location /grid/ {
    #     proxy_pass https://cctv.corp8.cloud/;
    #     proxy_set_header Host cctv.corp8.cloud;
    #     proxy_set_header Authorization "Basic PASTE_BASE64_email:password_HERE";
    #     proxy_ssl_server_name on;
    #     # Rewrite any absolute segment URLs in the playlist back through this
    #     # proxy so .ts segments load same-origin too.
    #     sub_filter_types application/vnd.apple.mpegurl application/x-mpegURL;
    #     sub_filter "https://cctv.corp8.cloud/" "/grid/";
    #     sub_filter_once off;
    #     proxy_hide_header Access-Control-Allow-Origin;
    #     add_header Access-Control-Allow-Origin "$scheme://$host" always;
    # }

    # Defence-in-depth headers. The CSP stays strict: no inline script, no eval,
    # no off-origin script/connect/font/object. The one deliberate exception is
    # img-src, which additionally allows the Esri "World Imagery" satellite
    # basemap host (arcgisonline.com) — Leaflet loads map tiles as <img>
    # elements, so allowing that one host in img-src is all the real Gujarat
    # satellite map needs. Tiles are free and keyless (no billing, no account),
    # served over HTTPS/443 so they load even on networks that block the RTSP
    # ports. connect-src stays 'self' (only the API + the live SSE stream), so
    # the console still makes no off-origin data or script calls.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # media-src + worker-src 'self' blob: are for the vendored hls.js player:
    # it feeds video to a <video> element via a blob: MediaSource and runs its
    # demuxer in a blob: Web Worker. Both are same-origin/blob only — no external
    # media host, because video is proxied through /grid/ above.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://server.arcgisonline.com https://*.arcgisonline.com; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
