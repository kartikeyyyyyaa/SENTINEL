# Sentinel — local development stack.
# Postgres is exposed on 5433 so it does not collide with a local Postgres install.

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: sentinel-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      APP_DB_USER: ${APP_DB_USER:-sentinel_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/bootstrap:/docker-entrypoint-initdb.d:ro
      # Also mounted here (not just in the api container) so psql can run
      # db/verify_parity.sql directly inside this container.
      - ./db:/srv/db:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sentinel}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./services/registry
    container_name: sentinel-api
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside the compose network the DB host is "db", not localhost.
      DATABASE_URL: postgresql://${APP_DB_USER:-sentinel_app}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB:-sentinel}
      DATABASE_ADMIN_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sentinel}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./services/registry:/srv
      - ./db:/srv/db:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  console:
    image: nginx:1.27-alpine
    container_name: sentinel-console
    restart: unless-stopped
    volumes:
      - ./web/console:/usr/share/nginx/html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    ports:
      - "127.0.0.1:8080:80"

volumes:
  pgdata:
